<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page introuvable · Hachado</title>
    <meta name="description" content="Cette page n'existe pas ou plus sur hachado.fr, création de sites internet à Tours." />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      @font-face {
        font-family: "Bricolage Grotesque";
        src: url("/fonts/bricolage-grotesque-latin-variable.woff2") format("woff2");
        font-weight: 200 800;
        font-stretch: 75% 100%;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: "Bricolage Fallback";
        src: local("Arial");
        font-stretch: 100%;
        font-style: normal;
        size-adjust: 100.24%;
        ascent-override: 92.78%;
        descent-override: 26.94%;
        line-gap-override: 0%;
      }

      :root {
        color-scheme: light;
        --color-bg: #F6EFE7;
        --color-surface: #FFF8F1;
        --color-ink: #23171D;
        --color-ink-soft: #5B4A52;
        --color-accent: #C9285B;
        --color-accent-hover: #A8204D;
        --color-accent-hot: #E2396F;
        --color-accent-pale: #FFB3C9;
        --color-line: rgba(35, 23, 29, 0.14);
        --font-display: "Bricolage Grotesque", "Bricolage Fallback", Arial, sans-serif;
        --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        background: var(--color-bg);
        color: var(--color-ink);
        font-family: var(--font-body);
        line-height: 1.55;
      }

      ::selection {
        background-color: var(--color-accent-pale);
        color: var(--color-ink);
      }

      :focus-visible {
        outline: 3px solid var(--color-accent);
        outline-offset: 3px;
      }

      .wrap {
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        padding: 4rem 1.5rem;
      }

      .axe {
        display: block;
        width: auto;
        height: 88px;
        margin-bottom: 2rem;
      }

      .label {
        margin: 0 0 1rem;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--color-accent);
      }

      h1 {
        font-family: var(--font-display);
        font-optical-sizing: auto;
        font-size: clamp(2rem, 6vw, 3.5rem);
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.03em;
        margin: 0 0 1.25rem;
        max-width: 18ch;
      }

      p.text {
        margin: 0 0 2.5rem;
        font-size: 1.0625rem;
        color: var(--color-ink-soft);
        max-width: 50ch;
      }

      .cta {
        display: inline-block;
        padding: 0.9rem 1.6rem;
        border-radius: 12px;
        background-color: var(--color-accent);
        color: var(--color-surface);
        font-weight: 600;
        font-size: 1rem;
        text-decoration: none;
        transition: background-color 0.25s ease;
      }

      .cta:hover {
        background-color: var(--color-accent-hover);
      }

      @media (prefers-reduced-motion: reduce) {
        .cta {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="axe" src="/logo-hachado-h.webp" alt="" width="303" height="380" />

      <p class="label">Erreur 404</p>
      <h1>Cette page est tombée sous la hache.</h1>
      <p class="text">
        Elle n'existe pas ou plus. Pas de panique, l'essentiel est toujours là.
      </p>
      <a class="cta" href="/">Retour à l'accueil</a>
    </div>
  </body>
</html>
