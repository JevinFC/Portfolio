    <!-- Cette logique doit rester synchronisee avec src/utils/introDecision.js, qui
         applique exactement les memes regles cote React. Si les deux divergent, le
         calque rose est peint pour une intro qui ne se joue jamais.

         Toute modification de ce script impose de recalculer son empreinte dans
         public/_headers, sinon il sera bloque. L'empreinte se calcule sur le script
         tel qu'il apparait dans dist/index.html apres build, pas sur cette source :
             node scripts/csp-hash.mjs -->
    <script>
      (function () {
        var p = new URLSearchParams(location.search).get("intro");
        var skip;
        if (p === "force") skip = false;
        else if (p === "skip") skip = true;
        else if (matchMedia("(prefers-reduced-motion: reduce)").matches) skip = false;
        else {
          var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
          var mobile = matchMedia("(max-width: 768px), (pointer: coarse)").matches;
          if (c && c.saveData === true) skip = true;
          else if (c && mobile && ["slow-2g", "2g", "3g"].indexOf(c.effectiveType) > -1) skip = true;
          else skip = false;
        }
        if (!skip) document.documentElement.classList.add("intro-pending");
      })();
    </script>
    <style>html.intro-pending body { background: #E2396F; }</style>
